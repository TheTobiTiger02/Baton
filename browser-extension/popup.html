<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; --bg: #f7f7fb; --card: #ffffff; --text: #1b1b1f; --muted: #5d5e66; --accent: #4f46e5; --on-accent: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1c22; --card: #262730; --text: #f1f1f6; --muted: #a9aab4; --accent: #a5a8ff; --on-accent: #16144d; } }
    body { margin: 0; width: 320px; font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px; font-weight: 600; }
    header img { width: 20px; height: 20px; border-radius: 5px; }
    main { padding: 6px 16px 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .muted { color: var(--muted); font-size: 12px; margin-top: 2px; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 9px 12px; margin-top: 8px; font: inherit; font-weight: 600; background: var(--accent); color: var(--on-accent); cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header><img src="icons/icon32.png" alt="" />Baton</header>
  <main id="root"><div class="muted">Loading…</div></main>
  <script src="popup.js"></script>
</body>
</html>
